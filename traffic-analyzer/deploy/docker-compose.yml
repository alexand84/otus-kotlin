# Панели мониторинга http://localhost:5601 (opensearch dashboards)

services:

  postgres:
    image: postgres:16-alpine
    container_name: ipfix-postgres
    environment:
      POSTGRES_DB: ipfix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - ipfix_bridge
    ports:
      - "5435:5432"
    volumes:
      - ipfix_pg_data:/var/lib/postgresql/data
#      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ipfix" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ipfix-kafka
    networks:
      - ipfix_bridge
    ports:
      - "9192:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ipfix_kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ipfix-kafka-ui
    networks:
      - ipfix_bridge
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-ipfix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: ipfix-clickhouse
    networks:
      - ipfix_bridge
    ports:
      - "8123:8123" # HTTP / JDBC
      - "9000:9000" # Native TCP
    environment:
      CLICKHOUSE_DB: ipfix
      CLICKHOUSE_USER: ipfix
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ipfix_ch_data:/var/lib/clickhouse
#      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      - kafka

  fluent-bit:
    container_name: fluent-bit
    image: fluent/fluent-bit
    networks:
      - ipfix_bridge
    ports:
      - "24224:24224"
      - "24224:24224/udp"
      - "2020:2020"
    environment:
      - opensearch_host=opensearch
      - opensearch_user=admin
      - opensearch_pass=adm-Password0
    volumes:
      - ./volumes/fluent-bit-etc/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./volumes/fluent-bit-etc/parsers.conf:/fluent-bit/etc/parsers.conf

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:latest
    networks:
      - ipfix_bridge
    environment:
      - discovery.type=single-node
      - http.port=9200
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=adm-Password0
    ports:
      - '9200:9200'
      - '9600:9600'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -ku admin:adm-Password0 https://localhost:9200/_cluster/health?pretty | grep status | grep -q '\\(green\\|yellow\\)'"
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    networks:
      - ipfix_bridge
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    depends_on:
      opensearch:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.29.0  # Use the official Envoy proxy image
    networks:
      - ipfix_bridge
    volumes:
      - ./volumes/envoy/envoy.yml:/etc/envoy/envoy.yml  # Mount your Envoy configuration file
    #      - ./envoy/certs:/etc/envoy/certs  # Mount your TLS certificates
    ports:
      - "8080:8080"

volumes:
  ipfix_pg_data:
  ipfix_kafka_data:
  ipfix_ch_data:
  opensearch-data:

networks:
  ipfix_bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.252.0/24
          gateway: 192.168.252.1